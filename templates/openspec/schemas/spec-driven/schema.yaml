# Project-local clone of the built-in `spec-driven` schema.
# Base version: OpenSpec 1.4.1 (@fission-ai/openspec). Re-diff against the
# package copy (<package>/schemas/spec-driven/) after any OpenSpec upgrade.
# Local customisations (re-diff each on upgrade):
#  1. the `specs` instruction and templates/spec.md require a `> **Tests:**`
#     traceability line on every scenario (see adopt-openspec-with-test-traceability);
#  2. a `- **GIVEN**` clause on every scenario, with the `specs` instruction
#     directing authors to the `gherkin-authoring` skill (see require-given-clauses);
#  3. the `apply` instruction opens with a once-per-session model-downgrade
#     prompt (see add-apply-model-downgrade-prompt).
name: spec-driven
version: 1
description: Default OpenSpec workflow - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      BRANCH ISOLATION (before writing any artifact):
      Ensure work happens on a dedicated non-trunk branch for this change
      (suggested convention: `change/<change-name>`). Check the current branch
      first.

      THIS IS A HARD STOP ON TRUNK. If the current branch is `main` or
      `master`, do NOT write any artifact on it. Create and switch to the
      change-scoped branch, or ask the user which branch to use, then end your
      turn if you need their answer. Do not author artifacts on `main`/`master`.

      If already on a non-trunk branch, confirm with the user that it is the
      intended branch for this change before proceeding — do not silently assume
      a stale or unrelated feature branch is correct.

      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with GIVEN/WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - **GHERKIN AUTHORING**: Before authoring scenarios, invoke the `gherkin-authoring` skill and apply its GIVEN/WHEN/THEN guidance — GIVEN describes a known initial state (not a user interaction), WHEN is one meaningful event, THEN is an observable outcome. In this repo the on-disk form is the markdown `#### Scenario:` + `- **GIVEN**` / `- **WHEN**` / `- **THEN**` bullet dialect, not real `.feature` syntax; use the skill for its authoring principles, not its literal syntax reference.
      - **GIVEN CLAUSE**: Every `#### Scenario:` MUST contain a `- **GIVEN**` clause describing its initial state, among the scenario's bullet lines. A scenario MUST NOT be a bare WHEN/THEN pair — an absent precondition hides the state a reader or test author needs. Omitting it fails the project's `lint:given` gate.
      - **TEST TRACEABILITY**: Every `#### Scenario:` MUST be immediately followed by a `> **Tests:**` line citing the e2e/unit spec(s) that exercise it (e.g. `> **Tests:** [`path/to.spec.ts`](...) — case`), or the literal word `none` when no test exists yet (`> **Tests:** none`). The line goes between the `#### Scenario:` heading and the GIVEN/WHEN/THEN bullets. Omitting it fails the project's traceability lint gate; silence is not permitted because an absent line is indistinguishable from an overlooked one. Cite the **concrete** test identifier — a real test-function name (e.g. `test_query_follows_pagination`) or the test file path — as soon as the covering test exists; the `lint:specs` gate resolves each non-`none` citation against the project's test suite (by function name or file path) and FAILS on any identifier it cannot find, so an invented or mistyped name is rejected. Use `none` only while no covering test has been written yet; replace it with the real identifier once the test lands.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      > **Tests:** none
      - **GIVEN** a signed-in user with data to export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and specs for requirements.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure
      - [ ] 1.2 Add dependencies to package.json

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function
      - [ ] 2.2 Add CSV formatting utilities
      ```

      Reference specs for what needs to be built, design for how to build it.
      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    BRANCH ISOLATION (before working the first task):
    Ensure a dedicated non-trunk branch is checked out for this change
    (suggested convention: `change/<change-name>`). Check the current branch
    first.

    THIS IS A HARD STOP ON TRUNK. If the current branch is `main` or `master`,
    do NOT edit project code or mark any task on it. Switch to (or create) the
    change-scoped branch, or ask the user which branch to use, then end your
    turn if you need their answer. Do not apply on `main`/`master`.

    If a non-trunk branch scoped to this change is already checked out, this
    step is satisfied — proceed to the model-downgrade prompt and the task list
    without further branch action.

    MODEL DOWNGRADE PROMPT (once per apply session, before any task work):
    Applying tasks is largely mechanical (working a checklist, flipping
    checkboxes), so a cheaper model usually suffices. Before touching the first
    task, ask the user whether to downgrade the implementation model (for
    example Opus to Sonnet). You cannot switch models yourself — tell the user
    to run `/model` (or `/fast`) to downgrade.

    THIS IS A HARD STOP, NOT A COURTESY NOTE. Ask, then end your turn and wait
    for the user's answer. In the turn where you show this prompt you MUST NOT
    read context files, work any task, mark any checkbox, or make any edit.
    Do not print the prompt and then continue in the same turn ("Proceeding
    now; interrupt if you want to switch" is exactly the wrong behavior). Stop
    and wait. Resume the workflow only after the user has answered.
    If you have already asked this session, or the user declined, do not prompt
    again — continue working the task list.

    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.

    TEST CITATION BACKFILL (after implementing tests):
    Whenever you write a test that exercises a scenario in this change's specs,
    backfill its concrete identifier into that scenario's `> **Tests:**` line —
    replace a placeholder `none` with the real test-function name or test file
    path. Cite the actual identifier the `lint:specs` gate can resolve; never
    invent or guess a name. Leave `> **Tests:** none` in place only for
    scenarios that still have no covering test — do not fabricate a citation to
    silence the gate. This step is additive to the directives above; it does not
    replace the branch-isolation check, the model-downgrade prompt, or the
    task-tracking workflow.
